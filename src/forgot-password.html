<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Forgot Password - OGSMS</title><link rel="icon" href="image/favicon.jpeg"><script src="https://cdn.tailwindcss.com"></script><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="css/ogsms-modern.css"></head><body class="auth-page"><main class="auth-shell"><div class="text-center mb-6"><a href="index.html" class="auth-logo">OGSMS</a></div><section class="auth-card"><div class="text-center mt-4"><h1 class="text-3xl font-extrabold text-[#0B4F63]">Forgot password?</h1><p class="text-gray-500 mt-2 text-sm">Enter your email and we'll send a secure reset link.</p></div><form id="forgotPasswordForm" class="mt-7 space-y-5"><div><label class="block text-sm font-semibold text-gray-700 mb-2">Email Address</label><input id="forgotEmail" type="email" class="ogsms-input" placeholder="you@example.com" autocomplete="email" required></div><button id="forgotBtn" class="w-full py-3.5 ogsms-accent-btn" type="submit">Send Reset Link</button></form><div class="text-center mt-6"><a href="login.html" class="text-[#0B4F63] font-semibold text-sm">← Back to Login</a></div></section></main><script src="js/app.js"></script></body></html>
