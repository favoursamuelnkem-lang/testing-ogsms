<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Login - OGSMS</title><link rel="icon" href="image/favicon.jpeg"><script src="https://cdn.tailwindcss.com"></script><link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="css/ogsms-modern.css"></head><body class="auth-page"><main class="auth-shell"><div class="text-center mb-6"><a href="index.html" class="auth-logo"><span class="auth-logo-mark">OG</span>OGSMS</a></div><section class="auth-card"><div class="auth-badge"><svg fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><path d="M12 3 20 6v6c0 5-3.4 8-8 9-4.6-1-8-4-8-9V6l8-3Z"/><path d="m9 12 2 2 4-4"/></svg></div><div class="text-center mt-4"><h1 class="text-3xl font-extrabold text-[#0B4F63]">Welcome Back</h1><p class="text-gray-500 mt-2 text-sm">Sign in to manage your numbers, wallet and SMS.</p></div><form id="loginForm" class="mt-7 space-y-5"><div><label class="block text-sm font-semibold text-gray-700 mb-2">Email Address</label><input id="email" type="email" placeholder="you@example.com" class="ogsms-input" autocomplete="email" required></div><div><div class="flex justify-between items-center mb-2"><label class="text-sm font-semibold text-gray-700">Password</label><a href="forgot-password.html" class="text-sm font-bold text-orange-500">Forgot password?</a></div><input id="password" type="password" placeholder="Enter your password" class="ogsms-input" autocomplete="current-password" required></div><button id="loginBtn" type="submit" class="w-full py-3.5 ogsms-accent-btn">Login</button></form><p class="text-center mt-6 text-gray-600 text-sm">Don't have an account? <a href="register.html" class="text-orange-500 font-bold">Create one</a></p><a href="index.html" class="block text-center mt-5 auth-foot">← Back to OGSMS</a></section><p class="text-center auth-foot mt-6">Secure access • Wallet protected • Global numbers</p></main><script src="js/app.js"></script></body></html>
