<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Create Account - OGSMS</title><link rel="icon" href="image/favicon.jpeg"><script src="https://cdn.tailwindcss.com"></script><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="css/ogsms-modern.css"></head><body class="auth-page"><main class="auth-shell"><div class="text-center mb-6"><a href="index.html" class="auth-logo">OGSMS</a></div><section class="auth-card"><div class="text-center mt-4"><h1 class="text-3xl font-extrabold text-[#0B4F63]">Create your account</h1><p class="text-gray-500 mt-2 text-sm">Start managing foreign numbers and SMS in minutes.</p></div><form id="registerForm" class="mt-7 space-y-4"><div><label class="block text-sm font-semibold text-gray-700 mb-2">Full Name</label><input id="fullName" type="text" placeholder="Your full name" class="ogsms-input" autocomplete="name" required></div><div><label class="block text-sm font-semibold text-gray-700 mb-2">Email Address</label><input id="email" type="email" placeholder="you@example.com" class="ogsms-input" autocomplete="email" required></div><div><label class="block text-sm font-semibold text-gray-700 mb-2">Phone Number</label><input id="phoneNumber" type="tel" inputmode="tel" placeholder="e.g. +234 801 234 5678" class="ogsms-input" autocomplete="tel" required></div><div><label class="block text-sm font-semibold text-gray-700 mb-2">Password</label><input id="password" type="password" placeholder="At least 6 characters" class="ogsms-input" minlength="6" autocomplete="new-password" required></div><button id="registerBtn" type="submit" class="w-full py-3.5 ogsms-accent-btn">Create Account</button></form><p class="text-center mt-6 text-gray-600 text-sm">Already have an account? <a href="login.html" class="text-orange-500 font-bold">Login</a></p><a href="index.html" class="block text-center mt-5 auth-foot">Back to OGSMS</a></section></main><script src="js/app.js"></script></body></html>
