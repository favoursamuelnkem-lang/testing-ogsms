<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Reset Password - OGSMS</title><link rel="icon" href="image/favicon.jpeg"><script src="https://cdn.tailwindcss.com"></script><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="css/ogsms-modern.css"></head><body class="auth-page"><main class="auth-shell"><div class="text-center mb-6"><a href="index.html" class="auth-logo">OGSMS</a></div><section class="auth-card"><div class="text-center mt-4"><h1 class="text-3xl font-extrabold text-[#0B4F63]">Set a new password</h1><p class="text-gray-500 mt-2 text-sm">Choose a strong password for your OGSMS account.</p></div><form id="resetPasswordForm" class="mt-7 space-y-5"><div><label class="block text-sm font-semibold text-gray-700 mb-2">New Password</label><input id="newPassword" type="password" class="ogsms-input" placeholder="At least 6 characters" minlength="6" required></div><div><label class="block text-sm font-semibold text-gray-700 mb-2">Confirm Password</label><input id="confirmPassword" type="password" class="ogsms-input" placeholder="Repeat your password" minlength="6" required></div><button id="resetBtn" class="w-full py-3.5 ogsms-accent-btn" type="submit">Reset Password</button></form><div id="resetResult" class="hidden mt-5 p-4 rounded-xl text-sm"></div></section></main><script src="js/app.js"></script></body></html>
